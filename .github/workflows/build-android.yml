name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.zip"
      - ".github/workflows/build-android.yml"

# contents: write is only used to delete older source ZIPs after a successful build.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses (runner has the SDK preinstalled)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Pick the newest source ZIP (any file name) and extract it
        run: |
          set -euo pipefail
          NEWEST=""
          NEWEST_T=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
            [ -n "$t" ] || t=0
            if [ "$t" -ge "$NEWEST_T" ]; then NEWEST="$f"; NEWEST_T="$t"; fi
          done
          if [ -n "$NEWEST" ]; then
            echo "Using source archive: $NEWEST"
            echo "SRC_ZIP=$NEWEST" >> "$GITHUB_ENV"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q "$NEWEST" -d "$RUNNER_TEMP/src"
            SETTINGS=$(find "$RUNNER_TEMP/src" -name settings.gradle.kts -print -quit)
          else
            echo "No ZIP in repo root; using project files in the repository"
            SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' -print -quit)
          fi
          [ -n "$SETTINGS" ] || { echo "settings.gradle.kts not found"; exit 1; }
          echo "PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)" >> "$GITHUB_ENV"

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          {
            echo "### Build summary"
            echo "- Source archive: \`${SRC_ZIP:-repository files}\`"
            echo "- APK: \`$APK\`"
            echo "- Size: $(du -h "$APK" | cut -f1)"
            echo "- Unit tests: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zarvimo-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Keep only the newest ZIP (auto-replace older uploads)
        if: success() && env.SRC_ZIP != ''
        run: |
          set -euo pipefail
          CANON="Zarvimo-Live-Cricket-Streaming-Lite.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          for f in *.zip; do
            [ -f "$f" ] || continue
            if [ "$f" != "$SRC_ZIP" ]; then git rm -q -- "$f"; changed=1; fi
          done
          if [ "$SRC_ZIP" != "$CANON" ]; then git mv -- "$SRC_ZIP" "$CANON"; changed=1; fi
          if [ "$changed" = 1 ]; then
            git commit -q -m "chore: keep latest source ZIP only [skip ci]"
            git push || echo "::warning::Could not push ZIP cleanup (branch protection?)"
          fi
